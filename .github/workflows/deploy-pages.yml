name: Publicar AulaIA en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configurar y habilitar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Instalar dependencias
        run: npm ci --prefix frontend
      - name: Compilar para la ruta del repositorio
        run: npm --prefix frontend run build
        env:
          GITHUB_PAGES: "true"
      - name: Verificar paquete
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/manifest.webmanifest
          test -s frontend/dist/sw.js
          grep -q 'href="/Aula-IA/manifest.webmanifest"' frontend/dist/index.html
      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
